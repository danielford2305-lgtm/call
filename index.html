<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Calling…</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#1f2937;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .card{background:#fff;border:1px solid #e5e7eb;padding:28px 32px;text-align:center;max-width:360px}
  .num{font-size:26px;font-weight:bold;margin:8px 0 18px}
  a.btn{display:inline-block;background:#1e3a8a;color:#fff;text-decoration:none;padding:10px 18px;margin:4px;font-size:15px}
  a.alt{background:#6b7280}
  p{font-size:13px;color:#6b7280}
</style>
</head>
<body>
<div class="card">
  <div>Calling with Zoom</div>
  <div class="num" id="num">…</div>
  <a class="btn" id="zoom" href="#">Call again</a>
  <a class="btn alt" id="tel" href="#">Use default phone app</a>
  <p id="note">This tab closes by itself in a moment.</p>
</div>
<script>
  // ?n=8664883983 (any format). Only US 10-digit numbers are dialled.
  // Auto-close: the tab closes 1.5 s after handing the number to Zoom.
  // The very first time on a browser it stays open, so the "Open Zoom?" prompt can be answered
  // (tick "Always allow"). Add &stay=1 to the link to keep the tab open on purpose.
  var CLOSE_AFTER_MS = 1500;
  var q = new URLSearchParams(location.search);
  var d = (q.get('n') || '').replace(/\D/g, '');
  if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
  var ok = d.length === 10;
  var e164 = '+1' + d;
  var note = document.getElementById('note');
  document.getElementById('num').textContent = ok
    ? '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6)
    : 'Not a valid US number';
  if (ok) {
    var zoom = 'zoomphonecall://' + encodeURIComponent(e164);
    document.getElementById('zoom').href = zoom;
    document.getElementById('tel').href = 'tel:' + e164;
    location.href = zoom;                       // hand the number to the Zoom app

    var firstTime = true;
    try { firstTime = !localStorage.getItem('zoomDialSeen'); localStorage.setItem('zoomDialSeen', '1'); } catch (e) {}
    if (q.get('stay') === '1' || firstTime) {
      note.textContent = firstTime
        ? 'First call on this browser: tick "Always allow" when asked to open Zoom. From the next call this tab closes by itself.'
        : 'You can close this tab after the call starts.';
    } else {
      setTimeout(function () {
        window.close();
        // If the browser refused to close it, say so instead of leaving a silent page.
        setTimeout(function () { note.textContent = 'You can close this tab after the call starts.'; }, 300);
      }, CLOSE_AFTER_MS);
    }
  } else {
    document.getElementById('zoom').style.display = 'none';
    document.getElementById('tel').style.display = 'none';
    note.textContent = '';
  }
</script>
</body>
</html>
